[package]
name = "termail"
version = "0.1.0"
description = "A terminal email client with a spatial workspace for conversations."
authors = ["Tuna Kılıç <tuna@tunakilic.com>"]
license = "MIT"
edition = "2024"

[dependencies]
base64 = "0.23.1"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
futures = "0.3.32"
mail-parser = "0.11.9"
mime_guess = "2.0.5"
opener = "0.9.0"
rataflow = "0.1.0"
ratatui = "0.30.2"
ratatui-spinner = { git = "https://github.com/ratatui/ratatui-spinner" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.6"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
